<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Vocab Trainer</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --border: #334155;
            --success: #22c55e;
            --warning: #eab308;
            --error: #ef4444;
        }

        body { font-family: system-ui, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 800px; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 15px; flex-wrap: wrap; gap: 10px; }
        h1 { font-size: 1.4rem; margin: 0; color: var(--accent); }
        
        .mode-selector { display: flex; gap: 6px; flex-wrap: wrap; }
        .mode-btn { background: var(--card-bg); border: 1px solid var(--border); color: var(--text-muted); padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; transition: all 0.2s; }
        .mode-btn.active { background: var(--accent); color: #0f172a; border-color: var(--accent); font-weight: bold; }
        .mode-btn.danger { border-color: var(--error); color: var(--error); }
        .mode-btn.danger:hover { background: rgba(239, 68, 68, 0.1); }

        .controls-bar { display: flex; gap: 12px; margin-bottom: 15px; flex-wrap: wrap; align-items: center; justify-content: space-between; background: rgba(255, 255, 255, 0.02); padding: 12px; border-radius: 10px; border: 1px solid var(--border); }
        select, input, textarea { background: var(--card-bg); color: var(--text-color); border: 1px solid var(--border); padding: 8px 12px; border-radius: 6px; font-size: 0.9rem; font-family: inherit; }
        textarea { width: 100%; height: 150px; direction: ltr; margin-top: 10px; resize: vertical; }
        
        .card { background-color: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 25px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); text-align: left; direction: ltr; margin-bottom: 20px; }
        .word-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .word { font-size: 2rem; font-weight: bold; color: var(--accent); margin: 0; }
        
        .audio-btn { background: var(--accent); border: none; border-radius: 50%; width: 40px; height: 40px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; transition: transform 0.1s; }
        .audio-btn:hover { transform: scale(1.05); }

        .section-title { font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); letter-spacing: 1px; margin-top: 15px; margin-bottom: 5px; }
        .definition { font-size: 1.1rem; margin-bottom: 15px; }
        .context-sentence { font-style: italic; background: rgba(255,255,255,0.03); padding: 12px; border-left: 3px solid var(--accent); border-radius: 4px; margin-bottom: 20px; }
        .hebrew-translation { direction: rtl; background: rgba(56, 189, 248, 0.1); padding: 12px; border-radius: 8px; margin-top: 15px; font-size: 1.05rem; display: none; border: 1px dashed var(--accent); }

        .btn { background: var(--card-bg); border: 1px solid var(--border); color: var(--text-color); padding: 10px 16px; border-radius: 8px; cursor: pointer; font-size: 1rem; transition: 0.2s; }
        .btn:hover { background-color: var(--border); }
        .btn-primary { background: var(--accent); color: #0f172a; border: none; font-weight: bold; }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-block { width: 100%; margin-top: 10px; }

        .nav-buttons { display: flex; gap: 10px; }
        .nav-buttons .btn { flex: 1; }

        .view-section { display: none; }
        
        /* Quiz */
        .quiz-question { font-size: 1.15rem; margin-bottom: 20px; text-align: left; direction: ltr; line-height: 1.5; }
        .quiz-options { display: flex; flex-direction: column; gap: 10px; direction: ltr; }
        .quiz-option { background: var(--card-bg); border: 1px solid var(--border); color: var(--text-color); padding: 12px; border-radius: 8px; cursor: pointer; text-align: left; transition: 0.2s; }
        .quiz-option:hover { border-color: var(--accent); }
        .quiz-option.correct { background: rgba(34, 197, 94, 0.2); border-color: var(--success); color: #4ade80; }
        .quiz-option.incorrect { background: rgba(239, 68, 68, 0.2); border-color: var(--error); color: #f87171; }
        .score-board { text-align: center; font-size: 1.2rem; padding: 20px; direction: rtl; }

        /* Table */
        table { width: 100%; border-collapse: collapse; direction: ltr; background: var(--card-bg); border-radius: 8px; overflow: hidden; font-size: 0.9rem; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid var(--border); }
        th { background: rgba(255,255,255,0.05); color: var(--text-muted); text-transform: uppercase; font-size: 0.75rem; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; }
        .badge-red { background: rgba(239, 68, 68, 0.2); color: #f87171; }
        .badge-yellow { background: rgba(234, 179, 8, 0.2); color: #facc15; }
        .badge-green { background: rgba(34, 197, 94, 0.2); color: #4ade80; }
        
        .helper-text { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 10px; direction: rtl; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>VocabMaster</h1>
            <div class="mode-selector">
                <button class="mode-btn active" id="btn-study" onclick="switchView('study')">📖 לימוד</button>
                <button class="mode-btn" id="btn-quiz" onclick="switchView('quiz')">🎯 בוחן משולב</button>
                <button class="mode-btn danger" id="btn-weak" onclick="startWeakQuiz()">🔥 מילים חלשות</button>
                <button class="mode-btn" id="btn-table" onclick="switchView('table')">📊 מעקב</button>
                <button class="mode-btn" id="btn-manage" onclick="switchView('manage')">⚙️ הוספת מילים</button>
            </div>
        </header>

        <!-- CONTROLS -->
        <div class="controls-bar" id="main-controls">
            <div>
                <span style="font-size: 0.9rem; color: var(--text-muted); direction: rtl; margin-left: 8px;">סט פעיל:</span>
                <select id="section-select" onchange="changeSection()"></select>
            </div>
            <div id="section-status-badge" style="font-size: 0.85rem;"></div>
        </div>

        <!-- STUDY MODE -->
        <div id="view-study" class="view-section" style="display: block;">
            <div style="text-align: right; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 8px;" id="study-counter"></div>
            <div class="card">
                <div class="word-header">
                    <h2 class="word" id="word-el"></h2>
                    <button class="audio-btn" onclick="speakCurrentWord()">🔊</button>
                </div>
                <div class="section-title">Definition</div>
                <div class="definition" id="definition-el"></div>
                <div class="section-title">Context</div>
                <div class="context-sentence" id="context-el"></div>
                <button class="btn btn-block" id="reveal-btn" onclick="toggleHebrew()">הצג תרגום</button>
                <div class="hebrew-translation" id="hebrew-el"></div>
            </div>
            <div class="nav-buttons">
                <button class="btn" onclick="prevStudyWord()">הקודם</button>
                <button class="btn btn-primary" onclick="nextStudyWord()">הבא ➔</button>
            </div>
            <button class="btn btn-block" style="border-color: var(--success); color: var(--success); margin-top: 15px;" id="finish-btn" onclick="markSectionFinished()">✔️ סיימתי את הסט הזה (פתח הבא)</button>
        </div>

        <!-- QUIZ MODE -->
        <div id="view-quiz" class="view-section">
            <div class="card" id="quiz-content"></div>
        </div>

        <!-- TABLE VIEW -->
        <div id="view-table" class="view-section">
            <div class="card" style="padding: 15px; direction: rtl;">
                <h2>טבלת שליטה</h2>
                <div style="overflow-x: auto;">
                    <table>
                        <thead><tr><th>Word</th><th>Set</th><th>Hebrew</th><th>Status</th></tr></thead>
                        <tbody id="table-body"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- MANAGE & BULK ADD -->
        <div id="view-manage" class="view-section">
            <div class="card" style="direction: rtl;">
                <h2>הוספת מילים מהירה (Bulk Import)</h2>
                <p class="helper-text">הדבק רשימת מילים בפורמט הבא (מופרד בקו אנכי |):<br>
                <code style="direction: ltr; display: block; margin: 10px 0; color: var(--accent);">Word | Definition | Context | Hebrew</code></p>
                
                <div style="margin-bottom: 15px;">
                    <label style="display:block; margin-bottom: 5px;">בחר סט קיים או הקלד שם לסט חדש:</label>
                    <input type="text" id="import-set-name" placeholder="למשל: Set 3" style="width: 100%; box-sizing: border-box;">
                </div>

                <textarea id="bulk-input" placeholder="Scrutinized | Examined closely | The committee scrutinized the plan | נבחן בדקדקנות"></textarea>
                <button class="btn btn-primary btn-block" onclick="processBulkImport()">➕ הוסף מילים למאגר</button>
            </div>
            
            <div class="card" style="direction: rtl; border-color: var(--error);">
                <h3 style="color: var(--error); margin-top: 0;">ניהול נתונים</h3>
                <button class="btn" style="color: var(--error); border-color: var(--error);" onclick="factoryReset()">⚠️ איפוס האתר ומחיקת התקדמות</button>
            </div>
        </div>
    </div>

    <script>
        // המפתחות החדשים לזיכרון - מבטיח טעינה חלקה ונפרדת מגרסאות ישנות
        const DB_DATA = 'vm_data_v2';
        const DB_STATUS = 'vm_status_v2';
        const DB_META = 'vm_meta_v2';

        const DEFAULT_DATA = {
            "set_1": {
                name: "Set 1",
                words: [
                    { id: "afterburner", word: "Afterburner", definition: "An auxiliary burner fitted to the exhaust system of a jet engine to increase thrust.", context: "The SR-71 ignited its afterburner to achieve supersonic speeds.", hebrew: "מבער אחורי" },
                    { id: "avionics", word: "Avionics", definition: "Electronic equipment fitted in an aircraft.", context: "The upgraded reconnaissance plane featured state-of-the-art avionics.", hebrew: "אוויוניקה" }
                ]
            },
            "set_2": {
                name: "Set 2",
                words: [
                    { id: "fidgety", word: "Fidgety", definition: "Inclined to fidget; restless or uneasy.", context: "Mindfulness practices can help calm a fidgety mind before an exam.", hebrew: "חסר מנוחה / קופצני" },
                    { id: "mindful", word: "Mindful", definition: "Conscious or aware of something.", context: "Being mindful of your breathing is the first step in the mental note technique.", hebrew: "קשוב / מודע" }
                ]
            }
        };

        // טעינה בטוחה של הנתונים החדשים
        let sectionsData;
        try {
            sectionsData = JSON.parse(localStorage.getItem(DB_DATA));
            if (!sectionsData || typeof sectionsData !== 'object' || Object.keys(sectionsData).length === 0) {
                sectionsData = DEFAULT_DATA;
                localStorage.setItem(DB_DATA, JSON.stringify(sectionsData));
            }
        } catch (e) {
            sectionsData = DEFAULT_DATA;
            localStorage.setItem(DB_DATA, JSON.stringify(sectionsData));
        }

        let wordStatuses = JSON.parse(localStorage.getItem(DB_STATUS)) || {};
        let completedSections = JSON.parse(localStorage.getItem(DB_META)) || {};
        completedSections[Object.keys(sectionsData)[0]] = true; // פתיחה אוטומטית של פרק 1

        const NOW = Date.now();
        const DECAY_TIME = 14 * 24 * 60 * 60 * 1000; 

        Object.values(sectionsData).forEach(sec => {
            sec.words.forEach(item => {
                if (!wordStatuses[item.id]) {
                    wordStatuses[item.id] = { status: 'red', lastTested: NOW };
                } else if (wordStatuses[item.id].status === 'green') {
                    if (NOW - wordStatuses[item.id].lastTested > DECAY_TIME) {
                        wordStatuses[item.id].status = 'yellow'; // מוריד צבע לירוק אחרי שבועיים
                    }
                }
            });
        });
        saveMeta();

        let sectionKeys = Object.keys(sectionsData);
        let currentSectionKey = sectionKeys[0];
        let studyIndex = 0;
        let isHebrewVisible = false;
        let quizQueue = [];
        let quizCurrentIndex = 0;
        let quizScore = 0;

        function saveMeta() {
            localStorage.setItem(DB_STATUS, JSON.stringify(wordStatuses));
            localStorage.setItem(DB_META, JSON.stringify(completedSections));
        }

        function isSectionUnlocked(secKey) {
            const index = sectionKeys.indexOf(secKey);
            if (index === 0) return true;
            return !!completedSections[sectionKeys[index - 1]];
        }

        function initData() {
            sectionKeys = Object.keys(sectionsData);
            const selectEl = document.getElementById('section-select');
            selectEl.innerHTML = '';
            
            sectionKeys.forEach((key) => {
                const sec = sectionsData[key];
                const unlocked = isSectionUnlocked(key);
                const opt = document.createElement('option');
                opt.value = key;
                opt.innerText = unlocked ? `${sec.name} ${completedSections[key] ? '✅' : ''}` : `🔒 ${sec.name} (נעול)`;
                if (!unlocked) opt.disabled = true;
                selectEl.appendChild(opt);
            });
            
            if (!sectionKeys.includes(currentSectionKey)) currentSectionKey = sectionKeys[0];
            selectEl.value = currentSectionKey;
            
            updateStatusBadge();
            updateStudyCard();
        }

        function updateStatusBadge() {
            const badge = document.getElementById('section-status-badge');
            const finishBtn = document.getElementById('finish-btn');
            if (completedSections[currentSectionKey]) {
                badge.innerHTML = '<span style="color: var(--success); font-weight: bold;">הושלם ✅</span>';
                finishBtn.innerText = '✔️ הסט הושלם';
            } else {
                badge.innerHTML = '<span style="color: var(--warning); font-weight: bold;">בלמידה ⏳</span>';
                finishBtn.innerText = '✔️ סיימתי את הסט (פתח הבא)';
            }
        }

        function changeSection() {
            currentSectionKey = document.getElementById('section-select').value;
            studyIndex = 0;
            updateStatusBadge();
            updateStudyCard();
        }

        function markSectionFinished() {
            completedSections[currentSectionKey] = true;
            saveMeta();
            initData();
        }

        function switchView(viewName) {
            document.querySelectorAll('.view-section').forEach(el => el.style.display = 'none');
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            
            document.getElementById(`view-${viewName}`).style.display = 'block';
            const btn = document.getElementById(`btn-${viewName}`);
            if(btn) btn.classList.add('active');

            if (viewName === 'study') updateStudyCard();
            if (viewName === 'table') renderTable();
            document.getElementById('main-controls').style.display = (viewName === 'manage' || viewName === 'table') ? 'none' : 'flex';
        }

        function updateStudyCard() {
            const words = sectionsData[currentSectionKey]?.words || [];
            if (words.length === 0) return;
            if (studyIndex >= words.length) studyIndex = 0;

            const item = words[studyIndex];
            document.getElementById('word-el').innerText = item.word;
            document.getElementById('definition-el').innerText = item.definition;
            document.getElementById('context-el').innerText = `"${item.context}"`;
            document.getElementById('hebrew-el').innerText = item.hebrew;
            document.getElementById('study-counter').innerText = `מילה ${studyIndex + 1} מתוך ${words.length}`;
            
            isHebrewVisible = false;
            document.getElementById('hebrew-el').style.display = 'none';
            document.getElementById('reveal-btn').innerText = 'הצג תרגום';
        }

        function toggleHebrew() {
            isHebrewVisible = !isHebrewVisible;
            document.getElementById('hebrew-el').style.display = isHebrewVisible ? 'block' : 'none';
            document.getElementById('reveal-btn').innerText = isHebrewVisible ? 'הסתר תרגום' : 'הצג תרגום';
        }

        function nextStudyWord() { studyIndex = (studyIndex + 1) % sectionsData[currentSectionKey].words.length; updateStudyCard(); }
        function prevStudyWord() { studyIndex = (studyIndex - 1 + sectionsData[currentSectionKey].words.length) % sectionsData[currentSectionKey].words.length; updateStudyCard(); }
        function speakCurrentWord() {
            const txt = sectionsData[currentSectionKey].words[studyIndex].word;
            const u = new SpeechSynthesisUtterance(txt);
            u.lang = 'en-US'; window.speechSynthesis.speak(u);
        }

        function switchViewQuiz(isWeakOnly) {
            document.querySelectorAll('.view-section').forEach(el => el.style.display = 'none');
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('view-quiz').style.display = 'block';
            document.getElementById('main-controls').style.display = 'flex';
            
            quizCurrentIndex = 0;
            quizScore = 0;
            quizQueue = [];

            let allUnlockedWords = [];
            sectionKeys.forEach(k => { if (isSectionUnlocked(k)) allUnlockedWords.push(...sectionsData[k].words); });

            if (isWeakOnly) {
                document.getElementById('btn-weak').classList.add('active');
                const weakWords = allUnlockedWords.filter(w => wordStatuses[w.id].status !== 'green');
                weakWords.forEach(w => generateQuizQuestions(w, quizQueue));
            } else {
                document.getElementById('btn-quiz').classList.add('active');
                const activeWords = sectionsData[currentSectionKey].words;
                activeWords.forEach(w => generateQuizQuestions(w, quizQueue));

                let pastWords = allUnlockedWords.filter(w => !activeWords.some(aw => aw.id === w.id));
                pastWords.sort(() => Math.random() - 0.5);
                let numToInject = Math.floor(quizQueue.length * 0.25);
                
                for(let i=0; i<numToInject && i<pastWords.length; i++){
                    generateQuizQuestions(pastWords[i], quizQueue);
                }
            }

            quizQueue.sort(() => Math.random() - 0.5);
            loadQuizQuestion();
        }

        function startWeakQuiz() { switchViewQuiz(true); }
        function switchView(viewName) { if(viewName === 'quiz') switchViewQuiz(false); else switchViewBase(viewName); }
        function switchViewBase(viewName) {
            document.querySelectorAll('.view-section').forEach(el => el.style.display = 'none');
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`view-${viewName}`).style.display = 'block';
            document.getElementById(`btn-${viewName}`).classList.add('active');
            document.getElementById('main-controls').style.display = (viewName === 'manage' || viewName === 'table') ? 'none' : 'flex';
            if (viewName === 'study') updateStudyCard();
            if (viewName === 'table') renderTable();
        }

        function generateQuizQuestions(wordObj, queue) {
            queue.push({ type: 'definition', target: wordObj });
            queue.push({ type: 'fill_blank', target: wordObj });
        }

        function loadQuizQuestion() {
            if (quizQueue.length === 0) {
                document.getElementById('quiz-content').innerHTML = `<div class="score-board">אין מילים למבחן זה!</div>`;
                return;
            }
            if (quizCurrentIndex >= quizQueue.length) {
                document.getElementById('quiz-content').innerHTML = `
                    <div class="score-board">
                        <h2>סיימת את הבוחן 🎉</h2>
                        <p>ציון: ${quizScore} / ${quizQueue.length}</p>
                        <button class="btn btn-primary" onclick="switchViewQuiz(false)">חזור לבוחן המשולב</button>
                    </div>`;
                return;
            }

            const currentTask = quizQueue[quizCurrentIndex];
            const wordObj = currentTask.target;
            
            let allWordsPool = [];
            sectionKeys.forEach(k => allWordsPool.push(...sectionsData[k].words));

            let html = `<div style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 5px;">שאלה ${quizCurrentIndex + 1} מתוך ${quizQueue.length}</div>`;

            if (currentTask.type === 'definition') {
                let options = [wordObj.definition];
                while (options.length < 4 && options.length < allWordsPool.length) {
                    let r = allWordsPool[Math.floor(Math.random() * allWordsPool.length)].definition;
                    if (!options.includes(r)) options.push(r);
                }
                options.sort(() => Math.random() - 0.5);
                html += `<div class="quiz-question">What is the meaning of: <strong style="color: var(--accent);">${wordObj.word}</strong>?</div><div class="quiz-options">`;
                options.forEach(opt => html += `<button class="quiz-option" onclick="checkAns(this, '${escapeQ(opt)}', '${escapeQ(wordObj.definition)}', '${wordObj.id}')">${opt}</button>`);
            } else {
                let masked = wordObj.context.replace(new RegExp(wordObj.word, 'gi'), '_____');
                let options = [wordObj.word];
                while (options.length < 4 && options.length < allWordsPool.length) {
                    let r = allWordsPool[Math.floor(Math.random() * allWordsPool.length)].word;
                    if (!options.includes(r)) options.push(r);
                }
                options.sort(() => Math.random() - 0.5);
                html += `<div class="quiz-question">Choose the correct word:<br><br><em>"${masked}"</em></div><div class="quiz-options">`;
                options.forEach(opt => html += `<button class="quiz-option" onclick="checkAns(this, '${escapeQ(opt)}', '${escapeQ(wordObj.word)}', '${wordObj.id}')">${opt}</button>`);
            }
            html += `</div>`;
            document.getElementById('quiz-content').innerHTML = html;
        }

        function escapeQ(str) { return str.replace(/'/g, "\\'").replace(/"/g, '&quot;'); }

        function checkAns(btn, selected, correct, wordId) {
            document.querySelectorAll('.quiz-option').forEach(b => b.disabled = true);
            let s = wordStatuses[wordId];
            s.lastTested = Date.now();

            if (selected === correct) {
                btn.classList.add('correct');
                quizScore++;
                if (s.status === 'red') s.status = 'yellow';
                else if (s.status === 'yellow') s.status = 'green';
            } else {
                btn.classList.add('incorrect');
                s.status = 'red';
                document.querySelectorAll('.quiz-option').forEach(b => {
                    if (b.innerText === correct) b.classList.add('correct');
                });
            }
            saveMeta();
            setTimeout(() => { quizCurrentIndex++; loadQuizQuestion(); }, 1500);
        }

        // --- BULK IMPORT ---
        function processBulkImport() {
            const raw = document.getElementById('bulk-input').value.trim();
            let setName = document.getElementById('import-set-name').value.trim();
            if (!raw) return alert("הדבק מילים בפורמט לפני השמירה.");
            
            let targetKey = null;
            for (const [k, v] of Object.entries(sectionsData)) {
                if (v.name === setName || k === setName) { targetKey = k; break; }
            }
            if (!targetKey) {
                if (!setName) setName = `Set ${Object.keys(sectionsData).length + 1}`;
                targetKey = setName.toLowerCase().replace(/\s+/g, '_');
                sectionsData[targetKey] = { name: setName, words: [] };
            }

            const lines = raw.split('\n');
            let addedCount = 0;

            lines.forEach(line => {
                const parts = line.split('|').map(p => p.trim());
                if (parts.length >= 4) {
                    const id = parts[0].toLowerCase().replace(/[^a-z0-9]/g, '');
                    sectionsData[targetKey].words.push({
                        id: id,
                        word: parts[0],
                        definition: parts[1],
                        context: parts[2],
                        hebrew: parts[3]
                    });
                    if (!wordStatuses[id]) wordStatuses[id] = { status: 'red', lastTested: Date.now() };
                    addedCount++;
                }
            });

            if (addedCount > 0) {
                localStorage.setItem(DB_DATA, JSON.stringify(sectionsData));
                saveMeta();
                initData();
                document.getElementById('bulk-input').value = '';
                alert(`הצלחה! נוספו ${addedCount} מילים ל-${setName}.`);
            } else {
                alert("לא זוהו מילים בפורמט התקין (Word | Def | Context | Heb). ודא שיש קו אנכי | בין הערכים.");
            }
        }

        function factoryReset() {
            if(confirm("בטוח? פעולה זו תמחק את כל הסטים וההתקדמות שלך!")) {
                localStorage.removeItem(DB_DATA);
                localStorage.removeItem(DB_STATUS);
                localStorage.removeItem(DB_META);
                location.reload();
            }
        }

        function renderTable() {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';
            for (const [sKey, sec] of Object.entries(sectionsData)) {
                sec.words.forEach(item => {
                    const st = wordStatuses[item.id]?.status || 'red';
                    let cls = 'badge-red', txt = 'לתרגול';
                    if (st === 'yellow') { cls = 'badge-yellow'; txt = 'במתקדמים'; }
                    if (st === 'green') { cls = 'badge-green'; txt = 'שלוט היטב'; }
                    
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td style="font-weight: bold; color: var(--accent);">${item.word}</td>
                        <td style="font-size: 0.8rem; color: var(--text-muted);">${sec.name}</td>
                        <td style="direction: rtl;">${item.hebrew}</td>
                        <td><span class="badge ${cls}">${txt}</span></td>`;
                    tbody.appendChild(tr);
                });
            }
        }

        initData();
    </script>
</body>
</html>
