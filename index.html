<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Vocabulary Trainer</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --border: #334155;
            --success: #22c55e;
            --warning: #eab308;
            --error: #ef4444;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 750px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        h1 {
            font-size: 1.3rem;
            margin: 0;
        }

        .controls-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.02);
            padding: 10px;
            border-radius: 10px;
            border: 1px solid var(--border);
        }

        select {
            background: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .mode-selector {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .mode-btn {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .mode-btn.active {
            background: var(--accent);
            color: #0f172a;
            border-color: var(--accent);
            font-weight: bold;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            text-align: left;
            direction: ltr;
            margin-bottom: 20px;
            position: relative;
        }

        .word-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .word {
            font-size: 2rem;
            font-weight: bold;
            color: var(--accent);
            margin: 0;
        }

        .audio-btn {
            background: var(--accent);
            border: none;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            transition: background 0.2s, transform 0.1s;
        }

        .audio-btn:hover {
            background: var(--accent-hover);
            transform: scale(1.05);
        }

        .section-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 1px;
            margin-top: 15px;
            margin-bottom: 5px;
        }

        .definition {
            font-size: 1.1rem;
            margin-bottom: 15px;
        }

        .context-sentence {
            font-style: italic;
            background: rgba(255, 255, 255, 0.03);
            padding: 12px;
            border-left: 3px solid var(--accent);
            border-radius: 4px;
            margin-bottom: 20px;
        }

        .hebrew-translation {
            direction: rtl;
            background: rgba(56, 189, 248, 0.1);
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 1.05rem;
            display: none;
            border: 1px dashed var(--accent);
        }

        .reveal-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            margin-top: 10px;
            width: 100%;
            transition: all 0.2s;
        }

        .reveal-btn:hover {
            border-color: var(--accent);
            color: var(--text-color);
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
        }

        .nav-btn {
            flex: 1;
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text-color);
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            transition: background 0.2s;
        }

        .nav-btn:hover {
            background-color: var(--border);
        }

        .nav-btn.primary {
            background-color: var(--accent);
            color: #0f172a;
            border: none;
            font-weight: bold;
        }

        .nav-btn.primary:hover {
            background-color: var(--accent-hover);
        }

        .view-section {
            display: none;
        }

        .quiz-question {
            font-size: 1.15rem;
            margin-bottom: 20px;
            text-align: left;
            direction: ltr;
            line-height: 1.5;
        }

        .quiz-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            direction: ltr;
        }

        .quiz-option {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text-color);
            padding: 12px 16px;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            font-size: 1rem;
            transition: all 0.2s;
        }

        .quiz-option:hover {
            border-color: var(--accent);
            background: rgba(56, 189, 248, 0.05);
        }

        .quiz-option.correct {
            background: rgba(34, 197, 94, 0.2);
            border-color: var(--success);
            color: #4ade80;
        }

        .quiz-option.incorrect {
            background: rgba(239, 68, 68, 0.2);
            border-color: var(--error);
            color: #f87171;
        }

        .score-board {
            text-align: center;
            font-size: 1.3rem;
            padding: 20px;
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            direction: ltr;
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid var(--border);
            font-size: 0.95rem;
        }

        th {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            font-size: 0.8rem;
            text-transform: uppercase;
        }

        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            display: inline-block;
            text-align: center;
        }

        .badge-red { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid var(--error); }
        .badge-yellow { background: rgba(234, 179, 8, 0.2); color: #facc15; border: 1px solid var(--warning); }
        .badge-green { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid var(--success); }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Academic Vocab Trainer</h1>
            <div class="mode-selector">
                <button class="mode-btn active" id="btn-study" onclick="switchView('study')">מצב לימוד</button>
                <button class="mode-btn" id="btn-quiz" onclick="switchView('quiz')">בוחן מלא</button>
                <button class="mode-btn" id="btn-table" onclick="switchView('table')">טבלת מעקב</button>
            </div>
        </header>

        <!-- SDC/SECTION SELECTOR BAR -->
        <div class="controls-bar">
            <span style="font-size: 0.9rem; color: var(--text-muted); direction: rtl;">בחר פרק / סקשן:</span>
            <select id="section-select" onchange="changeSection()">
                <!-- Injected by JS -->
            </select>
        </div>

        <!-- STUDY MODE -->
        <div id="view-study" class="view-section" style="display: block;">
            <div style="text-align: right; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 8px;" id="study-counter">מילה 1 מתוך הסט</div>
            <div class="card">
                <div class="word-header">
                    <h2 class="word" id="word-el"></h2>
                    <button class="audio-btn" onclick="speakWord(getCurrentSectionWords()[studyIndex].word)" title="שמע מילה">🔊</button>
                </div>

                <div class="section-title">Definition</div>
                <div class="definition" id="definition-el"></div>

                <div class="section-title">Academic Context</div>
                <div class="context-sentence" id="context-el"></div>

                <button class="reveal-btn" id="reveal-btn" onclick="toggleHebrew()">הצג תרגום לעברית</button>
                <div class="hebrew-translation" id="hebrew-el"></div>
            </div>

            <div class="nav-buttons">
                <button class="nav-btn" onclick="prevStudyWord()">הקודם</button>
                <button class="nav-btn primary" onclick="nextStudyWord()">הבא ➔</button>
            </div>
        </div>

        <!-- QUIZ MODE -->
        <div id="view-quiz" class="view-section">
            <div class="card">
                <div id="quiz-content">
                    <!-- Quiz injected by JS -->
                </div>
            </div>
        </div>

        <!-- TABLE VIEW -->
        <div id="view-table" class="view-section">
            <div class="card" style="padding: 15px;">
                <h2 style="font-size: 1.1rem; margin-top: 0; margin-bottom: 15px; direction: rtl;">מעקב מצב מילים כללי</h2>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>Word</th>
                                <th>Section</th>
                                <th>Hebrew</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="table-body">
                            <!-- Injected by JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        // מאגר המילים המחולק לסקשנים / פרקים
        const sectionsData = {
            "skunk_works_1": {
                name: "Skunk Works - Set 1",
                words: [
                    {
                        id: "scrutinized",
                        word: "Scrutinized",
                        definition: "Examined or inspected closely and thoroughly.",
                        context: "The research committee scrutinized the methodology section of the dissertation before approving the final defense.",
                        hebrew: "נבחן בדקדקנות / נסרק ביסודיות"
                    },
                    {
                        id: "mitigate",
                        word: "Mitigate",
                        definition: "To make less severe, serious, or painful.",
                        context: "Advanced thermal insulation materials are implemented to mitigate extreme temperature loads during atmospheric re-entry.",
                        hebrew: "למתן / להפחית חומרה"
                    }
                ]
            },
            "skunk_works_2": {
                name: "Skunk Works - Set 2",
                words: [
                    {
                        id: "disembed",
                        word: "Disembed",
                        definition: "To free or extract something from a surrounding context or matrix.",
                        context: "In composite material analysis, engineers must disembed individual stress components from complex tensor matrices.",
                        hebrew: "לחלץ / להוציא מהקשר או ממטריצה מקיפה"
                    },
                    {
                        id: "exasperating",
                        word: "Exasperating",
                        definition: "Intensely irritating; frustrating.",
                        context: "Debugging non-converging finite element models can be an exasperating experience for structural engineers.",
                        hebrew: "מתסכל / מעצבן ביותר"
                    },
                    {
                        id: "counterintuitive",
                        word: "Counterintuitive",
                        definition: "Contrary to intuition or common-sense expectation.",
                        context: "The aerodynamic behavior at supersonic speeds often presents counterintuitive pressure distributions.",
                        hebrew: "מנוגד לאינטואיציה"
                    }
                ]
            }
        };

        let currentSectionKey = Object.keys(sectionsData)[0];
        let studyIndex = 0;
        let isHebrewVisible = false;
        let quizQueue = [];
        let quizCurrentIndex = 0;
        let quizScore = 0;

        let wordStatuses = JSON.parse(localStorage.getItem('vocab_statuses')) || {};
        
        // אתחול סטטוסים למילים חדשות
        Object.values(sectionsData).forEach(sec => {
            sec.words.forEach(item => {
                if (!wordStatuses[item.id]) wordStatuses[item.id] = 'red';
            });
        });

        function saveStatuses() {
            localStorage.setItem('vocab_statuses', JSON.stringify(wordStatuses));
        }

        // אכלוס סלקטור הפרקים
        function initSectionSelect() {
            const selectEl = document.getElementById('section-select');
            selectEl.innerHTML = '<option value="ALL">🌟 כל הפרקים יחד (מבחן כולל / רטרוספקטיבי)</option>';
            
            for (const [key, sec] of Object.entries(sectionsData)) {
                const opt = document.createElement('option');
                opt.value = key;
                opt.innerText = sec.name;
                selectEl.appendChild(opt);
            }
        }

        function changeSection() {
            currentSectionKey = document.getElementById('section-select').value;
            studyIndex = 0;
            updateStudyCard();
        }

        function getCurrentSectionWords() {
            if (currentSectionKey === 'ALL') {
                let all = [];
                Object.values(sectionsData).forEach(sec => all.push(...sec.words));
                return all;
            }
            return sectionsData[currentSectionKey].words;
        }

        // --- NAVIGATION ---
        function switchView(viewName) {
            ['study', 'quiz', 'table'].forEach(v => {
                document.getElementById(`view-${v}`).style.display = 'none';
                document.getElementById(`btn-${v}`).classList.remove('active');
            });

            document.getElementById(`view-${viewName}`).style.display = 'block';
            document.getElementById(`btn-${viewName}`).classList.add('active');

            if (viewName === 'study') updateStudyCard();
            if (viewName === 'quiz') startComprehensiveQuiz();
            if (viewName === 'table') renderTable();
        }

        // --- STUDY MODE ---
        function updateStudyCard() {
            const words = getCurrentSectionWords();
            if (words.length === 0) return;
            if (studyIndex >= words.length) studyIndex = 0;

            const item = words[studyIndex];
            document.getElementById('word-el').innerText = item.word;
            document.getElementById('definition-el').innerText = item.definition;
            document.getElementById('context-el').innerText = `"${item.context}"`;
            document.getElementById('hebrew-el').innerText = item.hebrew;
            document.getElementById('study-counter').innerText = `מילה ${studyIndex + 1} מתוך ${words.length}`;
            
            isHebrewVisible = false;
            document.getElementById('hebrew-el').style.display = 'none';
            document.getElementById('reveal-btn').innerText = 'הצג תרגום לעברית';
        }

        function speakWord(text) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.9;
            window.speechSynthesis.speak(utterance);
        }

        function toggleHebrew() {
            isHebrewVisible = !isHebrewVisible;
            const hebrewEl = document.getElementById('hebrew-el');
            const btnEl = document.getElementById('reveal-btn');
            if (isHebrewVisible) {
                hebrewEl.style.display = 'block';
                btnEl.innerText = 'הסתר תרגום';
            } else {
                hebrewEl.style.display = 'none';
                btnEl.innerText = 'הצג תרגום לעברית';
            }
        }

        function nextStudyWord() {
            const words = getCurrentSectionWords();
            studyIndex = (studyIndex + 1) % words.length;
            updateStudyCard();
        }

        function prevStudyWord() {
            const words = getCurrentSectionWords();
            studyIndex = (studyIndex - 1 + words.length) % words.length;
            updateStudyCard();
        }

        // --- QUIZ MODE ---
        function startComprehensiveQuiz() {
            quizCurrentIndex = 0;
            quizScore = 0;
            quizQueue = [];

            const words = getCurrentSectionWords();
            // מבחן מלא על המילים בסקשן הנבחר (או על הכל אם נבחר ALL)
            words.forEach(wordObj => {
                quizQueue.push({ type: 'definition', target: wordObj });
                quizQueue.push({ type: 'fill_blank', target: wordObj });
            });

            quizQueue.sort(() => Math.random() - 0.5);
            loadQuizQuestion();
        }

        function loadQuizQuestion() {
            if (quizQueue.length === 0) {
                document.getElementById('quiz-content').innerHTML = `<div class="score-board">אין מילים בסקשן הזה כרגע.</div>`;
                return;
            }

            if (quizCurrentIndex >= quizQueue.length) {
                document.getElementById('quiz-content').innerHTML = `
                    <div class="score-board">
                        <h2>כל הכבוד! סיימת את הבוחן 🎉</h2>
                        <p>הצלחת ב-${quizScore} מתוך ${quizQueue.length} שאלות.</p>
                        <button class="nav-btn primary" onclick="startComprehensiveQuiz()" style="margin-top: 15px;">נסה שוב</button>
                    </div>
                `;
                return;
            }

            const currentTask = quizQueue[quizCurrentIndex];
            const wordObj = currentTask.target;
            const allWordsPool = getCurrentSectionWords(); // לצורך אפשרויות שגויות מתוך המאגר הרלוונטי

            let html = `<div style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 5px;">שאלה ${quizCurrentIndex + 1} מתוך ${quizQueue.length}</div>`;

            if (currentTask.type === 'definition') {
                let options = [wordObj.definition];
                while (options.length < 4 && options.length < allWordsPool.length) {
                    let randomItem = allWordsPool[Math.floor(Math.random() * allWordsPool.length)];
                    if (!options.includes(randomItem.definition)) options.push(randomItem.definition);
                }
                options.sort(() => Math.random() - 0.5);

                html += `
                    <div class="quiz-question">What is the meaning of: <strong style="color: var(--accent);">${wordObj.word}</strong>?</div>
                    <div class="quiz-options">
                `;
                options.forEach(opt => {
                    html += `<button class="quiz-option" onclick="checkAnswer(this, '${escapeQuotes(opt)}', '${escapeQuotes(wordObj.definition)}', '${wordObj.id}')">${opt}</button>`;
                });

            } else {
                let maskedContext = wordObj.context.replace(new RegExp(wordObj.word, 'gi'), '_____');
                let options = [wordObj.word];
                while (options.length < 4 && options.length < allWordsPool.length) {
                    let randomItem = allWordsPool[Math.floor(Math.random() * allWordsPool.length)].word;
                    if (!options.includes(randomItem)) options.push(randomItem);
                }
                options.sort(() => Math.random() - 0.5);

                html += `
                    <div class="quiz-question">Choose the correct word for the context:<br><br><em>"${maskedContext}"</em></div>
                    <div class="quiz-options">
                `;
                options.forEach(opt => {
                    html += `<button class="quiz-option" onclick="checkAnswer(this, '${escapeQuotes(opt)}', '${escapeQuotes(wordObj.word)}', '${wordObj.id}')">${opt}</button>`;
                });
            }

            html += `</div>`;
            document.getElementById('quiz-content').innerHTML = html;
        }

        function escapeQuotes(str) {
            return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }

        function checkAnswer(buttonElement, selected, correct, wordId) {
            const options = document.querySelectorAll('.quiz-option');
            options.forEach(btn => btn.disabled = true);

            if (selected === correct) {
                buttonElement.classList.add('correct');
                quizScore++;
                if (wordStatuses[wordId] === 'red') wordStatuses[wordId] = 'yellow';
                else if (wordStatuses[wordId] === 'yellow') wordStatuses[wordId] = 'green';
            } else {
                buttonElement.classList.add('incorrect');
                wordStatuses[wordId] = 'red';
                options.forEach(btn => {
                    if (btn.innerText === correct) btn.classList.0 = btn.classList.add('correct');
                });
            }
            saveStatuses();

            setTimeout(() => {
                quizCurrentIndex++;
                loadQuizQuestion();
            }, 1500);
        }

        // --- TABLE VIEW ---
        function renderTable() {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';

            for (const [secKey, secObj] of Object.entries(sectionsData)) {
                secObj.words.forEach(item => {
                    const status = wordStatuses[item.id] || 'red';
                    let badgeClass = 'badge-red';
                    let badgeText = 'לתרגול (חדש)';

                    if (status === 'yellow') {
                        badgeClass = 'badge-yellow';
                        badgeText = 'במתקדמים';
                    } else if (status === 'green') {
                        badgeClass = 'badge-green';
                        badgeText = 'שלוט היטב';
                    }

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td style="font-weight: bold; color: var(--accent);">${item.word}</td>
                        <td style="font-size: 0.85rem; color: var(--text-muted);">${secObj.name}</td>
                        <td>${item.hebrew}</td>
                        <td><span class="badge ${badgeClass}">${badgeText}</span></td>
                    `;
                    tbody.appendChild(tr);
                });
            }
        }

        // טעינה ראשונית
        initSectionSelect();
        updateStudyCard();
    </script>
</body>
</html>
